<html lang="en">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #0a0a0a, #1a1a1a, #2d2d2d);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  padding: 16px;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.03) 0%, transparent 50%),
              radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03) 0%, transparent 50%);
  pointer-events: none;
}

/* MAIN CARD */
.kiosk {
  width: 100%;
  max-width: 420px;
  background: rgba(30, 30, 30, 0.95);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
  animation: pop 0.6s ease;
  position: relative;
  z-index: 1;
  backdrop-filter: blur(10px);
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.upload-subtitle {
  margin-top: 8px;
  font-size: 14px;
  color: #aaaaaa;
  background: rgba(255,255,255,0.08);
  padding: 6px 12px;
  border-radius: 20px;
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.1);
}

/* DROP ZONE */
.drop-zone {
  margin-top: 20px;
  border: 2px dashed rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(145deg, rgba(40,40,40,0.8), rgba(30,30,30,0.8));
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

.drop-zone:hover {
  border-color: rgba(255,255,255,0.4);
  background: linear-gradient(145deg, rgba(50,50,50,0.9), rgba(40,40,40,0.9));
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.2);
}

.drop-zone i {
  font-size: 42px;
  color: #ffffff;
  margin-bottom: 8px;
  transition: transform 0.3s ease;
}

.drop-zone:hover i {
  transform: scale(1.1);
}

.drop-zone p {
  margin: 0;
  font-size: 16px;
  color: #cccccc;
  font-weight: 500;
}

/* INPUT */
input[type="file"] {
  display: none;
}

/* BUTTON */
.btn {
  margin-top: 22px;
  width: 100%;
  padding: 18px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg, #4a90a4, #2c5364);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  min-height: 48px;
  box-shadow: 0 4px 12px rgba(74, 144, 164, 0.4);
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s ease;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover {
  background: linear-gradient(135deg, #5aa0b4, #3a6374);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(74, 144, 164, 0.5);
}

.btn:active {
  transform: scale(0.98) translateY(0);
}

/* STATUS */
.status {
  margin-top: 16px;
  text-align: center;
  font-size: 14px;
  min-height: 20px;
  font-weight: 500;
  color: #ffffff;
  background: rgba(255,255,255,0.08);
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* FILE LIST */
.files {
  margin-top: 24px;
}

.files h4 {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.files h4::before {
  content: '\f07c'; /* Folder icon */
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  color: #4a90a4;
}

.files ul {
  list-style: none;
  padding: 0;
  margin: 0;
  max-height: 180px;
  overflow-y: auto;
  border-radius: 12px;
  background: rgba(40,40,40,0.6);
  border: 1px solid rgba(255,255,255,0.1);
}

.files li {
  padding: 14px 16px;
  background: transparent;
  border-radius: 0;
  margin-bottom: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  animation: fadeIn 0.35s ease;
  min-height: 48px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  transition: background 0.2s ease;
}

.files li:last-child {
  border-bottom: none;
}

.files li:hover {
  background: rgba(255,255,255,0.08);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.files a {
  text-decoration: none;
  color: #ffffff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  transition: color 0.2s ease;
}

.files a:hover {
  color: #4a90a4;
}

/* CUSTOM SCROLLBAR */
.files ul::-webkit-scrollbar {
  width: 6px;
}

.files ul::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
}

.files ul::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
}

.files ul::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.3);
}

/* FOOTER */
.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 12px;
  color: #666;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.footer a {
  color: #4a90a4;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s ease;
}

.footer a:hover {
  color: #5aa0b4;
  text-decoration: underline;
}

/* MOBILE EXTRA POLISH */
@media (max-width: 480px) {
  body {
    padding: 12px;
  }
  .kiosk {
    padding: 20px;
    border-radius: 20px;
  }
  .header h2 {
    font-size: 22px;
  }
  .drop-zone {
    padding: 30px 16px;
    min-height: 100px;
  }
  .drop-zone i {
    font-size: 36px;
  }
  .drop-zone p {
    font-size: 15px;
  }
  .btn {
    padding: 16px;
    font-size: 15px;
  }
  .files li {
    padding: 12px 14px;
  }
  .upload-subtitle {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .footer {
    margin-top: 16px;
    font-size: 11px;
  }
}

@media (max-width: 380px) {
  .kiosk {
    padding: 18px;
  }
  .drop-zone {
    padding: 26px 12px;
  }
  .header h2 {
    font-size: 20px;
  }
  .upload-subtitle {
    font-size: 13px;
    padding: 4px 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .drop-zone p {
    font-size: 14px;
  }
  .btn {
    padding: 14px;
    font-size: 14px;
  }
  .files h4 {
    font-size: 15px;
  }
  .files li {
    font-size: 13px;
    padding: 10px 12px;
  }
  .footer {
    margin-top: 14px;
    font-size: 11px;
  }
}

/* ADMIN PAGE */
.admin-page{display:none;position:fixed;inset:0;z-index:9999;overflow-y:auto;background:linear-gradient(135deg,#080808,#151515,#252525);padding:20px}
.admin-page.active{display:block}
.admin-wrap{max-width:1200px;margin:auto}
.admin-login{max-width:420px;margin:8vh auto;background:#1e1e1ef5;border:1px solid #ffffff1a;border-radius:24px;padding:30px;text-align:center;box-shadow:0 30px 80px #0009}
.admin-logo{width:64px;height:64px;border-radius:17px;object-fit:cover;margin-bottom:16px}
.admin-login h1{margin:0 0 8px}.admin-login p{color:#999;margin:0 0 22px}
.admin-input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #3b3b3b;background:#111;color:#fff;outline:none}
.admin-input:focus{border-color:#4a90a4}
.admin-login-btn,.admin-btn{border:0;border-radius:11px;padding:12px 15px;background:linear-gradient(135deg,#4a90a4,#2c5364);color:#fff;font-weight:700;cursor:pointer}
.admin-login-btn{width:100%;margin-top:12px}
.admin-error{color:#ff8585;min-height:20px;margin-top:10px;font-size:13px}
.admin-dashboard{display:none}.admin-dashboard.show{display:block}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;padding:17px 20px;background:#191919f5;border:1px solid #ffffff14;border-radius:18px}
.admin-brand{display:flex;align-items:center;gap:12px}.admin-brand img{width:42px;height:42px;border-radius:11px;object-fit:cover}

.admin-stat{padding:18px;border-radius:17px;background:#1c1cf5;border:1px solid #ffffff14}.admin-stat i{color:#4a90a4}
.admin-stat strong{display:block;font-size:27px;margin-top:7px}.admin-stat span{color:#888;font-size:13px}
.admin-toolbar{display:flex;gap:10px;margin-bottom:18px}.admin-search{flex:1}
.admin-orders{display:flex;flex-direction:column;gap:14px}
.admin-order{background:#1b1bf5;border:1px solid #ffffff14;border-radius:17px;overflow:hidden}
.admin-order-head{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #ffffff12}
.admin-order-title{font-weight:700}.admin-order-title i{color:#4a90a4;margin-right:7px}.admin-order-count{color:#777;font-size:12px;margin-top:3px}
.admin-file{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid #ffffff0d}.admin-file:last-child{border-bottom:0}

.admin-file-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-file-path{color:#666;font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-file-actions{display:flex;gap:6px}.admin-icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid #3b3b3b;background:#242424;color:#fff;cursor:pointer}.admin-icon-btn.delete{color:#ff8585}
.admin-empty{text-align:center;padding:50px 20px;color:#777;background:#171717;border:1px dashed #333;border-radius:16px}
.admin-toast{position:fixed;right:20px;bottom:20px;z-index:10001;display:none;padding:12px 15px;border-radius:11px;background:#222;border:1px solid #444}.admin-toast.show{display:block}
.admin-modal{position:fixed;inset:0;z-index:10002;display:none;align-items:center;justify-content:center;padding:20px;background:#000b}.admin-modal.show{display:flex}
.admin-modal-card{width:100%;max-width:420px;padding:22px;border-radius:18px;background:#202020;border:1px solid #444}.admin-modal-card h3{margin:0 0 15px}
.admin-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:700px){.admin-stats{grid-template-columns:1fr}.admin-topbar{align-items:flex-start;flex-direction:column}.admin-toolbar{flex-direction:column}.admin-file{align-items:flex-start}.admin-file-actions{flex-wrap:wrap}}

</style>
</head>

<body>


<div class="admin-page" id="adminPage">
  <div class="admin-wrap">
    <div class="admin-login" id="adminLogin">
      <img class="admin-logo" src="https://i.ibb.co/27dwJ8WC/Chat-GPT-Image-Sep-24-2026-03-04-09-PM.png" alt="Admin">
      <h1>Admin Login</h1>
      <p>Enter the administrator password.</p>
      <input class="admin-input" id="adminPassword" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter') adminLoginSubmit()">
      <button class="admin-login-btn" onclick="adminLoginSubmit()"><i class="fa-solid fa-lock-open"></i> Login</button>
      <div class="admin-error" id="adminError"></div>
    </div>

    <div class="admin-dashboard" id="adminDashboard">
      <div class="admin-topbar">
        <div class="admin-brand">
          <img src="https://i.ibb.co/27dwJ8WC/Chat-GPT-Image-Sep-24-2026-03-04-09-PM.png" alt="Logo">
          <div><strong>MyUploads Admin</strong><small>File Management Dashboard</small></div>
        </div>
        <div class="admin-actions">
          <button class="admin-btn secondary" onclick="adminLoadFiles()"><i class="fa-solid fa-rotate"></i> Refresh</button>

        <div class="admin-stat"><i class="fa-solid fa-folder"></i><strong id="adminTotalOrders">0</strong><span>Total Orders</span></div>
        <div class="admin-stat"><i class="fa-solid fa-database"></i><strong>printfiles</strong><span>Storage Bucket</span></div>
      </div>

      <div class="admin-toolbar">
        <input class="admin-input admin-search" id="adminSearch" placeholder="Search order ID or file name..." oninput="adminRenderFiles()">
      </div>
      <div class="admin-orders" id="adminOrders"></div>
    </div>
  </div>
</div>

<div class="admin-toast" id="adminToast"></div>
<div class="admin-modal" id="adminRenameModal">
  <div class="admin-modal-card">
    <h3><i class="fa-solid fa-pen"></i> Rename File</h3>
    <input class="admin-input" id="adminNewFileName" placeholder="New file name">
    <div class="admin-modal-actions">
      <button class="admin-btn secondary" onclick="adminCloseRename()">Cancel</button>
      <button class="admin-btn" onclick="adminConfirmRename()">Rename</button>
    </div>
  </div>
</div>

<div class="kiosk">
  <div class="header">
    <h2>Upload your files</h2>
    <div class="upload-subtitle" id="orderTitle">Secure file upload</div>
  </div>

  <div class="drop-zone" onclick="fileInput.click()">
    <i class="fa-solid fa-cloud-arrow-up"></i>
    <p>Tap to select any file</p>
  </div>

  <input type="file" id="fileInput" />

  <button class="btn" onclick="uploadFile()">Upload file</button>

  <div class="status" id="status"></div>

  <div class="files">
    <h4>uploaded files</h4>
    <ul id="fileList"></ul>

  <div class="footer">

  </div>
</div>

<script>
/******** CONFIG ********/
const SUPABASE_URL = "https://osenpykjrpvsfxeiyzox.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mMrbwgtyj9cmDBZbElgPLA_26yW1E7u";
const BUCKET = "printfiles";

const firebaseConfig = {
  apiKey: "AIzaSyAn-FF_aA2IahZaNn6MlEaIeP5NhS6tBAM",
  authDomain: "printohub-d9e88.firebaseapp.com",
  databaseURL: "https://printohub-d9e88-default-rtdb.firebaseio.com",
  projectId: "printohub-d9e88",
  storageBucket: "printohub-d9e88.firebasestorage.app",
  messagingSenderId: "691965670652",
  appId: "1:691965670652:web:eaa23c0cd66a7723b35379",
  measurementId: "G-2TJSF9S7HE"
};

const firebaseApp = firebase.apps && firebase.apps.length
  ? firebase.app()
  : firebase.initializeApp(firebaseConfig);

const realtimeDb = firebase.database();

if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

realtimeDb.ref(".info/connected").on("value", (snap) => {
  console.log("Firebase RTDB connected:", !!snap.val());
});

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/******** ORDER ID ********/
const queryOrderId = new URLSearchParams(window.location.search).get("orderId");
const orderId = queryOrderId || window.location.pathname.replace("/", "") || "UNKNOWN";
document.getElementById("orderTitle").innerText = "Secure file upload";
console.log("Computed orderId:", orderId);

let fileSerialNumber = 1;

// Initialize serial number from Firebase
async function initializeSerialNumber() {
  try {
    const snapshot = await realtimeDb.ref(`orders/${orderId}/nextSerialNumber`).once('value');
    const nextSerial = snapshot.val();
    if (nextSerial && typeof nextSerial === 'number') {
      fileSerialNumber = nextSerial;
    }
  } catch (e) {
    console.error("Failed to initialize serial number:", e);
  }
}

initializeSerialNumber();

const fileInput = document.getElementById("fileInput");

async function getPdfPageCount(file) {
  try {
    if (!file) {
      return null;
    }

    if (typeof file.type === "string" && file.type.startsWith("image/")) {
      return 1;
    }

    if (file.type !== "application/pdf") {
      return null;
    }
    if (!window.pdfjsLib || !window.pdfjsLib.getDocument) return null;

    const typedArray = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = function () {
        try {
          resolve(new Uint8Array(this.result));
        } catch (e) {
          reject(e);
        }
      };

      reader.onerror = function () {
        reject(reader.error || new Error("Failed to read PDF file"));
      };

      reader.readAsArrayBuffer(file);
    });

    const pdf = await window.pdfjsLib.getDocument(typedArray).promise;
    return pdf.numPages;
  } catch (e) {
    console.error("Failed to read PDF page count", e);
    return null;
  }
}

function saveUploadStatus(nextStatus, fileName, pageCount, fileUrl, filePath) {
  try {
    const payload = { status: nextStatus, uploadedAt: Date.now() };
    if (fileName) {
      payload.fileName = fileName;
    }
    if (typeof pageCount === "number" && Number.isFinite(pageCount)) {
      payload.pageCount = pageCount;
    }
    if (fileUrl) {
      payload.fileUrl = fileUrl;
    }
    if (filePath) {
      payload.filePath = filePath;
    }
    return realtimeDb.ref(`orders/${orderId}`).update(payload);
  } catch (e) {
    console.error("Failed to write upload status to Firebase RTDB", e);
  }
}

try {
  const statusRef = realtimeDb.ref(`orders/${orderId}/status`);
  statusRef.transaction((current) => current || "pending")
    .then(() => console.log("Ensured initial upload status: pending"))
    .catch((e) => console.error("Failed to write initial pending status to Firebase RTDB", e));
} catch (e) {
  console.error("Failed to initialize pending status", e);
}

/******** FILE SELECTION EVENT ********/
fileInput.addEventListener('change', function() {
  const status = document.getElementById("status");
  if (this.files.length > 0) {
    status.innerText = "Selected: " + this.files[0].name;
  } else {
    status.innerText = "";
  }
});

/******** UPLOAD ********/
async function uploadFile() {
  const status = document.getElementById("status");

  if (!fileInput.files.length) {
    status.innerText = "Please select a file ❌";
    return;
  }

  const file = fileInput.files[0];
  status.innerText = "Uploading…";

  const pageCountPromise = getPdfPageCount(file).catch(() => null);

  const path = `orders/${orderId}/${fileSerialNumber}_${file.name}`;

  const pendingWrite = saveUploadStatus("pending", file.name, null, null, path);
  if (pendingWrite && typeof pendingWrite.then === "function") {
    pendingWrite.then(() => console.log("Saved upload status: pending"))
      .catch((e) => console.error("Failed to write upload status to Firebase RTDB", e));
  }

  const { error } = await supabaseClient
    .storage
    .from(BUCKET)
    .upload(path, file);

  const pageCount = await pageCountPromise;

  if (error) {
    console.error("Supabase upload error:", error);
    status.innerText = `Upload failed: ${error.message || "Unknown error"} ❌`;
    const p = saveUploadStatus("failed", file.name, pageCount, null, path);
    if (p && typeof p.then === "function") {
      p.then(() => console.log("Saved upload status: failed"))
        .catch((e) => console.error("Failed to write upload status to Firebase RTDB", e));
    }
  } else {
    status.innerText = "Upload successful ✅";

    const { data: urlData } = supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(path);

    const fileUrl = urlData && urlData.publicUrl ? urlData.publicUrl : null;

    const p = saveUploadStatus("uploaded", file.name, pageCount, fileUrl, path);
    if (p && typeof p.then === "function") {
      p.then(() => console.log("Saved upload status: uploaded"))
        .catch((e) => console.error("Failed to write upload status to Firebase RTDB", e));
    }
    
    // Increment serial number and save to Firebase
    fileSerialNumber++;
    await realtimeDb.ref(`orders/${orderId}/nextSerialNumber`).set(fileSerialNumber);
    
    fileInput.value = "";

    loadFiles();
  }
}

/******** LOAD FILES ********/
async function loadFiles() {
  const list = document.getElementById("fileList");
  list.innerHTML = "";

  const { data } = await supabaseClient
    .storage
    .from(BUCKET)
    .list(`orders/${orderId}`);

  if (!data) return;

  data.forEach(file => {
    const li = document.createElement("li");
    li.innerHTML = `<i class="fa-regular fa-file" style="color: #4a90a4;"></i>`;

    const { data: url } = supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(`orders/${orderId}/${file.name}`);

    const a = document.createElement("a");
    a.href = url.publicUrl;
    a.target = "_blank";
    a.innerText = file.name;

    li.appendChild(a);
    list.appendChild(li);
  });
}

loadFiles();

/******** CLEANUP OLD FILES ********/
async function cleanupOldFiles() {
  try {
    const twentyFourHoursMs = 24 * 60 * 60 * 1000;
    const now = Date.now();

    const { data } = await supabaseClient
      .storage
      .from(BUCKET)
      .list(`orders/${orderId}`);

    if (!data || data.length === 0) return;

    for (const file of data) {
      const fileRef = realtimeDb.ref(`orders/${orderId}`);
      const snapshot = await fileRef.once('value');
      const orderData = snapshot.val();

      if (orderData && orderData.uploadedAt) {
        const fileAge = now - orderData.uploadedAt;
        if (fileAge > twentyFourHoursMs) {
          console.log(`Deleting old file: ${file.name}`);
          
          const { error: deleteError } = await supabaseClient
            .storage
            .from(BUCKET)
            .remove([`orders/${orderId}/${file.name}`]);

          if (deleteError) {
            console.error(`Failed to delete ${file.name}:`, deleteError);
          } else {
            console.log(`Successfully deleted ${file.name}`);
          }
        }
      }
    }
  } catch (e) {
    console.error("Error during file cleanup:", e);
  }
}

// Run cleanup on page load
cleanupOldFiles();

// Run cleanup every hour
setInterval(cleanupOldFiles, 60 * 60 * 1000);

/* ADMIN MODE */
const ADMIN_PASSWORD = "0001sis";
const ADMIN_PATH = "/admin";
let adminOrders = [];
let adminRenameTarget = null;

function isAdminPath(){
  const p=window.location.pathname.replace(/\/+$/,"");
  return p===ADMIN_PATH || p.endsWith(ADMIN_PATH);
}
function adminEscape(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function adminToast(msg){
  const e=document.getElementById("adminToast");e.innerText=msg;e.classList.add("show");
  clearTimeout(window.adminToastTimer);window.adminToastTimer=setTimeout(()=>e.classList.remove("show"),3000);
}
function adminLoginSubmit(){
  const p=document.getElementById("adminPassword").value;
  const e=document.getElementById("adminError");
  if(p===ADMIN_PASSWORD){
    sessionStorage.setItem("myuploadsAdmin","true");
    document.getElementById("adminLogin").style.display="none";
    document.getElementById("adminDashboard").classList.add("show");
    e.innerText="";adminLoadFiles();
  }else{e.innerText="Incorrect admin password.";document.getElementById("adminPassword").value="";document.getElementById("adminPassword").focus()}
}
function adminLogout(){sessionStorage.removeItem("myuploadsAdmin");location.reload()}

async function adminLoadFiles(){
  const c=document.getElementById("adminOrders");
  c.innerHTML='<div class="admin-empty"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading uploaded files...</p></div>';
  try{
    const {data:folders,error}=await supabaseClient.storage.from(BUCKET).list("orders",{limit:1000,sortBy:{column:"name",order:"asc"}});
    if(error) throw error;
    adminOrders=[];
    for(const folder of (folders||[])){
      if(!folder.name||folder.name===".emptyFolderPlaceholder") continue;
      const {data:files,error:fileError}=await supabaseClient.storage.from(BUCKET).list(`orders/${folder.name}`,{limit:1000,sortBy:{column:"name",order:"asc"}});
      if(fileError){console.error(fileError);continue}
      const real=(files||[]).filter(f=>f.name&&f.name!==".emptyFolderPlaceholder");
      if(real.length) adminOrders.push({orderId:folder.name,files:real});
    }
    adminUpdateStats();adminRenderFiles();adminToast("Files refreshed.");
  }catch(err){
    console.error(err);
    c.innerHTML=`<div class="admin-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load files.</p><small>${adminEscape(err.message||"Unknown error")}</small></div>`;
    adminToast("Failed to load files.");
  }
}
function adminUpdateStats(){
  document.getElementById("adminTotalFiles").innerText=adminOrders.reduce((n,o)=>n+o.files.length,0);
  document.getElementById("adminTotalOrders").innerText=adminOrders.length;
}
function adminRenderFiles(){
  const c=document.getElementById("adminOrders"),q=document.getElementById("adminSearch").value.trim().toLowerCase();
  const filtered=adminOrders.map(o=>({orderId:o.orderId,files:o.orderId.toLowerCase().includes(q)?o.files:o.files.filter(f=>f.name.toLowerCase().includes(q))})).filter(o=>o.files.length);
  if(!filtered.length){c.innerHTML='<div class="admin-empty"><i class="fa-regular fa-folder-open" style="font-size:30px"></i><p>No uploaded files found.</p></div>';return}
  c.innerHTML=filtered.map(o=>`
    <div class="admin-order">
      <div class="admin-order-head">
        <div><div class="admin-order-title"><i class="fa-solid fa-folder"></i>${adminEscape(o.orderId)}</div><div class="admin-order-count">${o.files.length} file${o.files.length===1?"":"s"}</div></div>
        <button class="admin-btn danger" onclick="adminDeleteOrder(${JSON.stringify(o.orderId)})"><i class="fa-solid fa-trash"></i> Delete Order</button>
      </div>
      ${o.files.map(f=>adminFileRow(o.orderId,f)).join("")}
    </div>`).join("");
}
function adminFileRow(orderId,file){
  return `<div class="admin-file">
    <div class="admin-file-icon"><i class="fa-regular fa-file"></i></div>
    <div class="admin-file-info"><div class="admin-file-name">${adminEscape(file.name)}</div><div class="admin-file-path">orders/${adminEscape(orderId)}/${adminEscape(file.name)}</div></div>
    <div class="admin-file-actions">
      <button class="admin-icon-btn" title="Open" onclick="adminOpenFile(${JSON.stringify(orderId)},${JSON.stringify(file.name)})"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
      <button class="admin-icon-btn" title="Rename" onclick="adminOpenRename(${JSON.stringify(orderId)},${JSON.stringify(file.name)})"><i class="fa-solid fa-pen"></i></button>
      <button class="admin-icon-btn delete" title="Delete" onclick="adminDeleteFile(${JSON.stringify(orderId)},${JSON.stringify(file.name)})"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>`;
}
function adminOpenFile(orderId,fileName){
  const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(`orders/${orderId}/${fileName}`);
  if(data?.publicUrl) window.open(data.publicUrl,"_blank"); else adminToast("Could not open file.");
}
async function adminDeleteFile(orderId,fileName){
  if(!confirm(`Delete this file?\n\n${fileName}\n\nThis cannot be undone.`)) return;
  try{
    const {error}=await supabaseClient.storage.from(BUCKET).remove([`orders/${orderId}/${fileName}`]);
    if(error) throw error;
    adminToast("File deleted.");await adminLoadFiles();
  }catch(e){console.error(e);adminToast("Delete failed: "+(e.message||"Unknown error"))}
}
async function adminDeleteOrder(orderId){
  const o=adminOrders.find(x=>x.orderId===orderId);if(!o)return;
  if(!confirm(`Delete ALL ${o.files.length} file(s) in order "${orderId}"?\n\nThis cannot be undone.`))return;
  try{
    const {error}=await supabaseClient.storage.from(BUCKET).remove(o.files.map(f=>`orders/${orderId}/${f.name}`));
    if(error)throw error;adminToast("Order deleted.");await adminLoadFiles();
  }catch(e){console.error(e);adminToast("Could not delete order.")}
}
function adminOpenRename(orderId,fileName){
  adminRenameTarget={orderId,fileName};
  document.getElementById("adminNewFileName").value=fileName;
  document.getElementById("adminRenameModal").classList.add("show");
  setTimeout(()=>{const i=document.getElementById("adminNewFileName");i.focus();i.select()},50);
}
function adminCloseRename(){adminRenameTarget=null;document.getElementById("adminRenameModal").classList.remove("show")}
async function adminConfirmRename(){
  if(!adminRenameTarget)return;
  const newName=document.getElementById("adminNewFileName").value.trim();
  if(!newName){alert("Enter a file name.");return}
  if(newName.includes("/")||newName.includes("\\")){alert("File name cannot contain / or \\.");return}
  const {orderId,fileName}=adminRenameTarget;
  if(newName===fileName){adminCloseRename();return}
  try{
    const {error}=await supabaseClient.storage.from(BUCKET).move(`orders/${orderId}/${fileName}`,`orders/${orderId}/${newName}`);
    if(error)throw error;adminCloseRename();adminToast("File renamed.");await adminLoadFiles();
  }catch(e){console.error(e);adminToast("Rename failed: "+(e.message||"Unknown error"))}
}
function startAdminMode(){
  document.querySelector(".kiosk").style.display="none";
  document.getElementById("adminPage").classList.add("active");
  if(sessionStorage.getItem("myuploadsAdmin")==="true"){
    document.getElementById("adminLogin").style.display="none";
    document.getElementById("adminDashboard").classList.add("show");
    adminLoadFiles();
  }
}
if(isAdminPath()) startAdminMode();
