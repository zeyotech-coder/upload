<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyUploads Admin</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/27dwJ8WC/Chat-GPT-Image-Sep-24-2026-03-04-09-PM.png">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* ================= LOGIN ================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 70px rgba(0,0,0,.5);
    }

    .login-logo {
      width: 75px;
      height: 75px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
      border-radius: 16px;
    }

    .login-card h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .login-card p {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid #333;
      background: #181818;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .input:focus {
      border-color: #777;
    }

    .login-btn {
      width: 100%;
      border: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 11px;
      background: white;
      color: black;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .login-btn:hover {
      background: #ddd;
    }

    .login-error {
      min-height: 20px;
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
    }

    /* ================= ADMIN ================= */

    .admin-page {
      min-height: 100vh;
      padding: 25px;
    }

    .admin-container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
      padding: 18px 20px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 17px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #888;
      font-size: 12px;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid #333;
      background: #181818;
      color: white;
      padding: 10px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn:hover {
      background: #252525;
    }

    .btn-danger {
      border-color: #552727;
      color: #ff7777;
    }

    .btn-danger:hover {
      background: #301717;
    }

    /* ================= STATS ================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
    }

    .stat-icon {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 700;
    }

    .stat-label {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    /* ================= SEARCH ================= */

    .toolbar {
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
    }

    .search {
      padding-left: 40px;
    }

    /* ================= ORDERS ================= */

    .orders {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .order {
      background: #111;
      border: 1px solid #292929;
      border-radius: 17px;
      overflow: hidden;
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 17px 18px;
      background: #151515;
      border-bottom: 1px solid #242424;
    }

    .order-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      word-break: break-all;
    }

    .order-title i {
      color: #aaa;
    }

    .order-count {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .files {
      padding: 5px 15px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 5px;
      border-bottom: 1px solid #222;
    }

    .file-row:last-child {
      border-bottom: none;
    }

    .file-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1b1b;
      border-radius: 9px;
      color: #aaa;
      flex-shrink: 0;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      word-break: break-all;
    }

    .file-path {
      color: #666;
      font-size: 11px;
      margin-top: 4px;
      word-break: break-all;
    }

    .file-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 35px;
      height: 35px;
      border: 1px solid #333;
      background: #181818;
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #282828;
      color: white;
    }

    .icon-btn.delete:hover {
      color: #ff6868;
      border-color: #542525;
      background: #281515;
    }

    /* ================= EMPTY ================= */

    .empty {
      background: #111;
      border: 1px solid #292929;
      border-radius: 17px;
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .empty i {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .empty p {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #777;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 430px;
      background: #121212;
      border: 1px solid #303030;
      border-radius: 17px;
      padding: 25px;
    }

    .modal-card h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #fff;
      color: #000;
      padding: 12px 17px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: .25s;
      z-index: 10000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ================= MOBILE ================= */

    @media(max-width:700px) {

      .admin-page {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions .btn {
        flex: 1;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .order-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .file-row {
        align-items: flex-start;
      }

      .file-actions {
        flex-direction: column;
      }

      .icon-btn {
        width: 33px;
        height: 33px;
      }

      .login-card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-page" id="loginPage">

  <div class="login-card">

    <img
      class="login-logo"
      src="https://i.ibb.co/27dwJ8WC/Chat-GPT-Image-Sep-24-2026-03-04-09-PM.png"
      alt="MyUploads">

    <h1>Admin Login</h1>

    <p>MyUploads file management</p>

    <input
      class="input"
      id="password"
      type="password"
      placeholder="Enter admin password"
      autocomplete="off">

    <button class="login-btn" onclick="login()">
      <i class="fa-solid fa-lock-open"></i>
      Login
    </button>

    <div class="login-error" id="loginError"></div>

  </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="admin-page hidden" id="adminPage">

  <div class="admin-container">

    <!-- TOP BAR -->

    <div class="topbar">

      <div class="brand">

        <img
          src="https://i.ibb.co/27dwJ8WC/Chat-GPT-Image-Sep-24-2026-03-04-09-PM.png"
          alt="MyUploads">

        <div>
          <div class="brand-title">
            MyUploads Admin
          </div>

          <div class="brand-subtitle">
            File Management Dashboard
          </div>
        </div>

      </div>

      <div class="top-actions">

        <button class="btn" onclick="loadFiles()">
          <i class="fa-solid fa-rotate"></i>
          Refresh
        </button>

        <button class="btn" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </button>

      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="stat-icon">
          <i class="fa-solid fa-file"></i>
        </div>

        <div class="stat-number" id="totalFiles">
          0
        </div>

        <div class="stat-label">
          Total Files
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          <i class="fa-solid fa-folder"></i>
        </div>

        <div class="stat-number" id="totalOrders">
          0
        </div>

        <div class="stat-label">
          Total Orders
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          <i class="fa-solid fa-database"></i>
        </div>

        <div class="stat-number">
          printfiles
        </div>

        <div class="stat-label">
          Supabase Storage
        </div>

      </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

      <div class="search-wrapper">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          class="input search"
          id="search"
          placeholder="Search order ID or file name..."
          oninput="renderFiles()">

      </div>

    </div>


    <!-- FILES -->

    <div class="orders" id="orders">

      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        Loading files...
      </div>

    </div>

  </div>

</div>


<!-- ================= RENAME MODAL ================= -->

<div class="modal" id="renameModal">

  <div class="modal-card">

    <h2>
      <i class="fa-solid fa-pen"></i>
      Rename File
    </h2>

    <input
      class="input"
      id="newFileName"
      placeholder="New file name">

    <div class="modal-actions">

      <button class="btn" onclick="closeRename()">
        Cancel
      </button>

      <button class="btn" onclick="renameFile()">
        Rename
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  "https://osenpykjrpvsfxeiyzox.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mMrbwgtyj9cmDBZbElgPLA_26yW1E7u";

const BUCKET = "printfiles";

const ADMIN_PASSWORD = "0001sis";


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let orders = [];

let renameTarget = null;


/* =========================================================
   LOGIN
========================================================= */

function login() {

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  if (password === ADMIN_PASSWORD) {

    sessionStorage.setItem(
      "myuploads_admin",
      "true"
    );

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

    error.innerText = "";

    loadFiles();

  } else {

    error.innerText =
      "Incorrect admin password.";

    document
      .getElementById("password")
      .value = "";

    document
      .getElementById("password")
      .focus();

  }

}


/* ENTER KEY LOGIN */

document
  .getElementById("password")
  .addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
      login();
    }

  });


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  sessionStorage.removeItem(
    "myuploads_admin"
  );

  location.reload();

}


/* =========================================================
   LOAD ORDERS + FILES
========================================================= */

async function loadFiles() {

  const container =
    document.getElementById("orders");

  container.innerHTML = `
    <div class="loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      Loading uploaded files...
    </div>
  `;

  try {

    const result =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list(
          "orders",
          {
            limit: 1000,
            sortBy: {
              column: "name",
              order: "asc"
            }
          }
        );

    if (result.error) {
      throw result.error;
    }

    const folders =
      result.data || [];

    orders = [];


    for (const folder of folders) {

      /* Ignore Supabase placeholder */

      if (
        !folder.name ||
        folder.name === ".emptyFolderPlaceholder"
      ) {
        continue;
      }


      const resultFiles =
        await supabaseClient
          .storage
          .from(BUCKET)
          .list(
            `orders/${folder.name}`,
            {
              limit: 1000,
              sortBy: {
                column: "name",
                order: "asc"
              }
            }
          );


      if (resultFiles.error) {

        console.error(
          resultFiles.error
        );

        continue;
      }


      const realFiles =
        (resultFiles.data || [])
          .filter(file =>
            file.name &&
            file.name !== ".emptyFolderPlaceholder"
          );


      if (realFiles.length > 0) {

        orders.push({
          orderId: folder.name,
          files: realFiles
        });

      }

    }


    updateStats();

    renderFiles();

    showToast("Files refreshed.");

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">

        <i class="fa-solid fa-triangle-exclamation"></i>

        <p>
          Could not load files.
        </p>

        <small>
          ${escapeHTML(error.message || "Unknown error")}
        </small>

      </div>
    `;

  }

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

  let fileCount = 0;

  orders.forEach(order => {
    fileCount += order.files.length;
  });


  document
    .getElementById("totalFiles")
    .innerText = fileCount;


  document
    .getElementById("totalOrders")
    .innerText = orders.length;

}


/* =========================================================
   RENDER
========================================================= */

function renderFiles() {

  const container =
    document.getElementById("orders");

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    orders
      .map(order => {

        const orderMatches =
          order.orderId
            .toLowerCase()
            .includes(search);


        const files =
          orderMatches
            ? order.files
            : order.files.filter(file =>
                file.name
                  .toLowerCase()
                  .includes(search)
              );


        return {
          orderId: order.orderId,
          files: files
        };

      })
      .filter(order =>
        order.files.length > 0
      );


  if (filtered.length === 0) {

    container.innerHTML = `
      <div class="empty">

        <i class="fa-regular fa-folder-open"></i>

        <p>
          No uploaded files found.
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML =
    filtered
      .map(order => {

        return `
          <div class="order">

            <div class="order-header">

              <div>

                <div class="order-title">

                  <i class="fa-solid fa-folder"></i>

                  ${escapeHTML(order.orderId)}

                </div>

                <div class="order-count">

                  ${order.files.length}
                  file${order.files.length === 1 ? "" : "s"}

                </div>

              </div>


              <button
                class="btn btn-danger"
                onclick="deleteOrder(${JSON.stringify(order.orderId)})">

                <i class="fa-solid fa-trash"></i>

                Delete Order

              </button>

            </div>


            <div class="files">

              ${order.files
                .map(file =>
                  renderFile(
                    order.orderId,
                    file
                  )
                )
                .join("")}

            </div>

          </div>
        `;

      })
      .join("");

}


/* =========================================================
   FILE ROW
========================================================= */

function renderFile(
  orderId,
  file
) {

  return `
    <div class="file-row">

      <div class="file-icon">

        <i class="fa-regular fa-file"></i>

      </div>


      <div class="file-info">

        <div class="file-name">

          ${escapeHTML(file.name)}

        </div>

        <div class="file-path">

          orders/${escapeHTML(orderId)}/${escapeHTML(file.name)}

        </div>

      </div>


      <div class="file-actions">

        <button
          class="icon-btn"
          title="View"
          onclick="openFile(
            ${JSON.stringify(orderId)},
            ${JSON.stringify(file.name)}
          )">

          <i class="fa-solid fa-arrow-up-right-from-square"></i>

        </button>


        <button
          class="icon-btn"
          title="Rename"
          onclick="openRename(
            ${JSON.stringify(orderId)},
            ${JSON.stringify(file.name)}
          )">

          <i class="fa-solid fa-pen"></i>

        </button>


        <button
          class="icon-btn delete"
          title="Delete"
          onclick="deleteFile(
            ${JSON.stringify(orderId)},
            ${JSON.stringify(file.name)}
          )">

          <i class="fa-solid fa-trash"></i>

        </button>

      </div>

    </div>
  `;

}


/* =========================================================
   OPEN FILE
========================================================= */

function openFile(
  orderId,
  fileName
) {

  const result =
    supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(
        `orders/${orderId}/${fileName}`
      );


  if (
    result.data &&
    result.data.publicUrl
  ) {

    window.open(
      result.data.publicUrl,
      "_blank"
    );

  } else {

    showToast(
      "Could not open file."
    );

  }

}


/* =========================================================
   DELETE FILE
========================================================= */

async function deleteFile(
  orderId,
  fileName
) {

  const confirmed =
    confirm(
      `Delete this file?\n\n${fileName}\n\nThis cannot be undone.`
    );


  if (!confirmed) {
    return;
  }


  try {

    const result =
      await supabaseClient
        .storage
        .from(BUCKET)
        .remove([
          `orders/${orderId}/${fileName}`
        ]);


    if (result.error) {
      throw result.error;
    }


    showToast(
      "File deleted successfully."
    );


    await loadFiles();

  } catch (error) {

    console.error(error);

    showToast(
      "Delete failed: " +
      (error.message || "Unknown error")
    );

  }

}


/* =========================================================
   DELETE ENTIRE ORDER
========================================================= */

async function deleteOrder(
  orderId
) {

  const order =
    orders.find(
      item =>
        item.orderId === orderId
    );


  if (!order) {
    return;
  }


  const confirmed =
    confirm(
      `Delete ALL ${order.files.length} file(s) in order "${orderId}"?\n\nThis cannot be undone.`
    );


  if (!confirmed) {
    return;
  }


  try {

    const paths =
      order.files.map(
        file =>
          `orders/${orderId}/${file.name}`
      );


    const result =
      await supabaseClient
        .storage
        .from(BUCKET)
        .remove(paths);


    if (result.error) {
      throw result.error;
    }


    showToast(
      "Order deleted successfully."
    );


    await loadFiles();

  } catch (error) {

    console.error(error);

    showToast(
      "Could not delete order."
    );

  }

}


/* =========================================================
   RENAME
========================================================= */

function openRename(
  orderId,
  fileName
) {

  renameTarget = {
    orderId: orderId,
    fileName: fileName
  };


  document
    .getElementById("newFileName")
    .value = fileName;


  document
    .getElementById("renameModal")
    .classList.add("show");


  setTimeout(() => {

    const input =
      document.getElementById(
        "newFileName"
      );

    input.focus();
    input.select();

  }, 100);

}


function closeRename() {

  renameTarget = null;

  document
    .getElementById("renameModal")
    .classList.remove("show");

}


/* =========================================================
   CONFIRM RENAME
========================================================= */

async function renameFile() {

  if (!renameTarget) {
    return;
  }


  const newName =
    document
      .getElementById("newFileName")
      .value
      .trim();


  if (!newName) {

    alert(
      "Enter a file name."
    );

    return;
  }


  if (
    newName.includes("/") ||
    newName.includes("\\")
  ) {

    alert(
      "File name cannot contain / or \\."
    );

    return;
  }


  const oldName =
    renameTarget.fileName;

  const orderId =
    renameTarget.orderId;


  if (newName === oldName) {

    closeRename();

    return;
  }


  try {

    const result =
      await supabaseClient
        .storage
        .from(BUCKET)
        .move(
          `orders/${orderId}/${oldName}`,
          `orders/${orderId}/${newName}`
        );


    if (result.error) {
      throw result.error;
    }


    closeRename();

    showToast(
      "File renamed successfully."
    );


    await loadFiles();

  } catch (error) {

    console.error(error);

    showToast(
      "Rename failed: " +
      (error.message || "Unknown error")
    );

  }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message) {

  const toast =
    document.getElementById("toast");


  toast.innerText =
    message;


  toast.classList.add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 3000);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

  ) === "true"

}
